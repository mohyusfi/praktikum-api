info:
  name: Eksperimen 1 - Filter Kategori
  type: graphql
  seq: 10

graphql:
  method: POST
  url: "{{base_url}}/graphql"
  body:
    query: |
      query {
        destinations(category: "pantai") {
          id
          name
          category
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
