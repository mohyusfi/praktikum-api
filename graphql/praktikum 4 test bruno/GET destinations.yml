info:
  name: GET destinations
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{base_url}}/graphql"
  body:
    query: |-
      query {
       destinations {
       	name
       }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
