info:
  name: GET BY ID (DOESNT EXISTS)
  type: graphql
  seq: 5

graphql:
  method: POST
  url: "{{base_url}}/graphql"
  body:
    query: |
      query {
        destination(id: 1) {
          name
          region {
            name
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
