info:
  name: 5. Get Post By ID - Not Found (404)
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/posts/99999999"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.message
      operator: eq
      value: "Resource not found"
  scripts:
    - type: tests
      code: |
        test("Status code is 404 Not Found", function() {
          expect(res.getStatus()).to.equal(404);
        });
        test("Message is Resource not found", function() {
          const body = res.getBody();
          expect(body).to.have.property('message', 'Resource not found');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
