info:
  name: Eksperimen 3 - Update Gagal
  type: graphql
  seq: 13

graphql:
  method: POST
  url: "{{base_url}}/graphql"
  body:
    query: |
      mutation {
        updateDestination(id: 1, name: "Danau Poso", category: "danau", regionId: 999) {
          id
          name
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
