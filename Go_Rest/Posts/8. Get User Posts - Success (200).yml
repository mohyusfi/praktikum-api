info:
  name: 8. Get User Posts - Success (200)
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/users/{{userId}}/posts"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Response is an array of user posts", function() {
          const body = res.getBody();
          expect(Array.isArray(body)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
