info:
  name: Eksperimen 2 - Relasi Sebaliknya
  type: graphql
  seq: 11

graphql:
  method: POST
  url: "{{base_url}}/graphql"
  body:
    query: |
      query {
        regions {
          id
          name
          destinations {
            name
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
