info:
  name: Eksperimen 3 - Update Berhasil
  type: graphql
  seq: 12

graphql:
  method: POST
  url: "{{base_url}}/graphql"
  body:
    query: |
      mutation {
        updateDestination(id: 1, name: "Danau Poso Indah", category: "danau", regionId: 2) {
          id
          name
          category
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
