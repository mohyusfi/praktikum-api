info:
  name: Eksperimen 3 - Delete Berhasil
  type: graphql
  seq: 14

graphql:
  method: POST
  url: "{{base_url}}/graphql"
  body:
    query: |
      mutation {
        deleteDestination(id: 6) {
          id
          name
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
